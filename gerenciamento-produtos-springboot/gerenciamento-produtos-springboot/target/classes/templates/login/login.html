<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/login.css}"></head>
<body class="auth-page">
<div class="auth-card"><div class="card-body">
<div class="auth-eyebrow">Área restrita</div><h1 class="h4">Nature Organic</h1><p class="text-muted mb-4">Entre para gerenciar sua linha de produtos capilares.</p>
<div th:if="${msg}" class="alert alert-danger" th:text="${msg}"></div>
<form th:action="@{/login}" th:object="${usuario}" method="post">
<div class="mb-3"><label class="form-label">Usuário</label><input class="form-control" th:field="*{user}"></div>
<div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" th:field="*{senha}"></div>
<button class="btn btn-success w-100">Entrar</button>
</form>
<div class="d-flex flex-column gap-2 mt-3">
    <a th:href="@{/}" class="btn btn-outline-secondary w-100">Voltar para a página oficial</a>
    <a th:href="@{/cadastro}" class="d-block text-center">Criar conta</a>
</div>
</div></div>
</body></html>
