<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragmentos/fragmentos :: cabecalho}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Produtos</h1>
        <a th:href="@{/produtos/novo}" class="btn btn-success">+ Novo produto</a>
    </div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <form class="row g-2 mb-3" method="get" th:action="@{/produtos}">
        <div class="col-md-9"><input class="form-control" name="nome" th:value="${nomeBusca}" placeholder="Pesquisar por nome"></div>
        <div class="col-md-3 d-grid"><button class="btn btn-primary">Pesquisar</button></div>
    </form>
    <div class="table-responsive card shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark"><tr><th>ID</th><th>Nome</th><th>Código</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead>
            <tbody>
            <tr th:each="produto : ${produtos}">
                <td th:text="${produto.id}">1</td>
                <td th:text="${produto.nome}">Produto</td>
                <td th:text="${produto.codigoBarras}">000</td>
                <td th:text="${#numbers.formatDecimal(produto.preco, 1, 2)}">0,00</td>
                <td><span th:text="${produto.quantidadeEstoque}" th:classappend="${produto.quantidadeEstoque > 0 ? 'text-success fw-bold' : 'text-secondary'}">0</span></td>
                <td class="d-flex gap-1">
                    <a th:href="@{/produtos/editar/{id}(id=${produto.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <form th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="post" class="m-0" onsubmit="return confirm('Excluir este produto?');"><button class="btn btn-sm btn-outline-danger">Excluir</button></form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="6" class="text-center py-4 text-muted">Nenhum produto encontrado.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragmentos/fragmentos :: rodape}"></div>
</body>
</html>
