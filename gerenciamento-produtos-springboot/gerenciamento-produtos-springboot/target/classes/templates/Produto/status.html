<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Produtos</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragmentos/fragmentos :: cabecalho}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3" th:text="${titulo}">Produtos</h1><a th:href="@{/produtos}" class="btn btn-outline-primary">Voltar</a></div>
    <div class="table-responsive card shadow-sm"><table class="table table-striped mb-0"><thead class="table-dark"><tr><th>Nome</th><th>Código</th><th>Preço</th><th>Estoque</th></tr></thead><tbody>
        <tr th:each="produto : ${produtos}"><td th:text="${produto.nome}">Produto</td><td th:text="${produto.codigoBarras}">000</td><td th:text="${#numbers.formatDecimal(produto.preco,1,2)}">0,00</td><td th:text="${produto.quantidadeEstoque}">0</td></tr>
        <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="4" class="text-center text-muted py-4">Nenhum registro.</td></tr>
    </tbody></table></div>
</div>
</body>
</html>
